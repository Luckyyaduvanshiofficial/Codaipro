<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: file:; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codai Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app" id="app">
        <aside class="sidebar" id="sidebar" aria-label="Conversations">
            <div class="sidebar-top">
                <button class="icon-btn" id="toggle-sidebar" title="Toggle sidebar (Ctrl+B)" aria-label="Toggle sidebar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
                </button>
                <button class="new-chat-btn" id="new-chat" title="New chat (Ctrl+N)">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New chat
                </button>
            </div>
            <div class="search-wrap">
                <input id="search" type="search" placeholder="Search chats (Ctrl+K)" aria-label="Search chats" autocomplete="off">
            </div>
            <nav class="conv-list" id="conv-list" aria-label="Chat history"></nav>
            <div class="sidebar-foot">
                <button class="foot-btn" id="open-settings">Settings</button>
                <button class="foot-btn" id="open-logs">Logs</button>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button class="icon-btn only-collapsed" id="expand-sidebar" title="Show sidebar" aria-label="Show sidebar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
                </button>
                <div class="chat-title" id="chat-title">Codai Pro</div>
                <div class="status" id="status" role="status" aria-live="polite">
                    <span class="dot" id="status-dot"></span>
                    <span id="status-text">Starting...</span>
                </div>
            </header>

            <div class="notice hidden" id="notice" role="alert"></div>

            <section class="thread" id="thread" aria-live="off">
                <div class="welcome" id="welcome">
                    <img class="brand-mark" src="../../assets/app-icon.svg" width="56" height="56" alt="">
                    <h1>What can I help you build?</h1>
                    <p>Private and offline. Everything runs on your computer.</p>
                    <div class="suggestions">
                        <button class="suggestion" data-prompt="Write a Python script that reads a CSV file and prints the top 5 rows by a column.">
                            <span class="s-title">Script</span><span class="s-text">Read a CSV and summarize it in Python</span>
                        </button>
                        <button class="suggestion" data-prompt="Explain how React useEffect works, with a short example.">
                            <span class="s-title">Explain</span><span class="s-text">How React useEffect works</span>
                        </button>
                        <button class="suggestion" data-prompt="Help me find the bug in this JavaScript: for (var i = 0; i < 3; i++) { setTimeout(() => console.log(i), 0); }">
                            <span class="s-title">Debug</span><span class="s-text">Why does this log 3, 3, 3?</span>
                        </button>
                        <button class="suggestion" data-prompt="Write a SQL query that returns the top 5 customers by total revenue from orders(customer_id, amount).">
                            <span class="s-title">Query</span><span class="s-text">Top customers by revenue in SQL</span>
                        </button>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
            </section>

            <footer class="composer-wrap">
                <div class="composer" id="composer">
                    <textarea id="input" rows="1" placeholder="Message Codai Pro..." aria-label="Message" maxlength="20000"></textarea>
                    <button class="send-btn" id="send" disabled aria-label="Send message" title="Send (Enter)">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                    </button>
                    <button class="stop-btn hidden" id="stop" aria-label="Stop generating" title="Stop">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
                    </button>
                </div>
                <div class="hint">Codai can make mistakes. Check important code before you run it.</div>
            </footer>
        </main>

        <div class="modal hidden" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="modal-card">
                <div class="modal-head">
                    <h2 id="settings-title">Settings</h2>
                    <button class="icon-btn" id="close-settings" aria-label="Close settings">&times;</button>
                </div>
                <label class="field">
                    <span>Theme</span>
                    <select id="set-theme">
                        <option value="system">System</option>
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </label>
                <label class="field">
                    <span>System prompt</span>
                    <textarea id="set-prompt" rows="4" maxlength="4000"></textarea>
                </label>
                <label class="field">
                    <span>Creativity <output id="set-temp-out"></output></span>
                    <input id="set-temp" type="range" min="0" max="2" step="0.1">
                </label>
                <label class="field">
                    <span>Max response length <output id="set-tokens-out"></output></span>
                    <input id="set-tokens" type="range" min="64" max="2048" step="64">
                </label>
                <div class="modal-foot">
                    <button class="danger" id="delete-all">Delete all chats</button>
                    <button class="primary" id="save-settings">Save</button>
                </div>
            </div>
        </div>
    </div>
    <script src="markdown.js"></script>
    <script src="app.js"></script>
</body>
</html>
