name: Build and Release CodaiPro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v3.0.0)'
        required: true
        default: 'v3.0.0'

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil pyinstaller

    - name: Download llama-server engine (Windows CPU)
      shell: pwsh
      run: |
        $releases = Invoke-RestMethod "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=20"
        $release = $releases | Where-Object { $_.assets.Count -gt 3 } | Select-Object -First 1
        $asset = $release.assets | Where-Object { $_.name -match 'bin-win-cpu-x64\.zip$' } | Select-Object -First 1
        if (-not $asset) { throw "No Windows CPU engine asset found" }
        Write-Host "Downloading engine: $($asset.name)"
        Invoke-WebRequest $asset.browser_download_url -OutFile engine.zip
        # Flatten: the llama.cpp zip nests files inside its own folder
        New-Item -ItemType Directory -Force -Path engine | Out-Null
        Expand-Archive engine.zip -DestinationPath engine_tmp
        Get-ChildItem engine_tmp -Recurse -File | ForEach-Object { Copy-Item $_.FullName engine/ }
        Remove-Item engine_tmp -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item engine.zip -Force -ErrorAction SilentlyContinue
        Get-ChildItem engine | Select-Object -First 10
        if (-not (Test-Path "engine/llama-server.exe")) { throw "llama-server.exe missing after extraction" }

        # Bundle the MSVC runtime app-local so clean machines can start the engine.
        foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
          $source = Join-Path $env:WINDIR "System32\$dll"
          if (Test-Path $source) { Copy-Item $source engine/ -Force }
          else { throw "Required MSVC runtime $dll not found on the runner" }
        }

    - name: Bundle the default AI model
      shell: pwsh
      run: |
        $config = Get-Content config.json | ConvertFrom-Json
        if (-not $config.model_url) { throw "config.json has no model_url to bundle" }
        New-Item -ItemType Directory -Force models | Out-Null
        $target = "models\$($config.model_name)"
        if (-not (Test-Path $target)) {
          Write-Host "Downloading $($config.model_name)"
          Invoke-WebRequest $config.model_url -OutFile $target
        }
        $size = (Get-Item $target).Length
        if ($size -lt 8MB) { throw "Downloaded model is too small: $size bytes" }
        Write-Host "Bundled model: $target ($size bytes)"

    - name: Build Codai.exe
      run: |
        python -m PyInstaller Codai.spec

    - name: Assemble portable package
      shell: pwsh
      run: |
        $dest = "portable\CodaiPro"
        New-Item -ItemType Directory -Force -Path $dest, "$dest\engine", "$dest\models" | Out-Null
        Copy-Item "dist\Codai.exe" $dest
        # Copy folder CONTENTS into pre-created engine/ (Copy-Item nests
        # when the destination folder already exists)
        Copy-Item -Recurse -Force "engine\*" "$dest\engine\"
        Copy-Item -Recurse -Force "dev" "$dest\"
        Copy-Item -Recurse -Force "ui" "$dest\"
        Copy-Item "config.json", "run.bat", "kill.bat", "help.txt" $dest
        if (-not (Test-Path "$dest\engine\llama-server.exe")) { throw "llama-server.exe did not land in portable engine/" }
        $modelReadme = @"
        Drop ONE .gguf model file in this folder, then double-click run.bat.

        Default model expected by config.json:
          gemma-3-1b-it-Q4_K_M.gguf  (0.81 GB)
          https://huggingface.co/bartowski/google_gemma-3-1b-it-GGUF

        Other good picks (see the website guide):
          Qwen3.5-0.8B (0.58 GB) - newest
          Qwen3-0.6B   (0.48 GB)
          Llama 3.2 1B (0.81 GB)
          Phi-3.5-mini (2.3 GB)
          Qwen2.5-Coder-3B / 7B - best coding quality

        Using a different filename? Set "model_name" in config.json.
        Full guide: https://luckyyaduvanshiofficial.github.io/Codaipro/#download
        "@
        Set-Content -Path "$dest\models\README.txt" -Value $modelReadme
        Write-Host "Portable package assembled:"
        Get-ChildItem -Recurse $dest -File | Measure-Object -Property Length -Sum | ForEach-Object { "{0} files, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB) }

    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path "portable\*" -DestinationPath "CodaiPro-${{ env.VERSION }}-Portable-Windows.zip"

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodaiPro-Windows-Portable
        path: CodaiPro-${{ env.VERSION }}-Portable-Windows.zip

    - name: Assemble offline portable package
      id: offline
      shell: pwsh
      run: |
        $versionNumber = "${{ env.VERSION }}".TrimStart('v')
        $dest = "portable-offline\CodaiPro"
        Remove-Item "portable-offline" -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        Copy-Item -Recurse -Force "portable\CodaiPro\*" $dest
        Copy-Item "models\*.gguf" "$dest\models\" -Force

        $portableReadme = @(
          'Codai Pro - Offline Portable (USB)',
          '==================================',
          '',
          '1. Extract this zip to a writable folder on your USB drive.',
          '2. Double-click run.bat.',
          '3. Wait for [READY]. Your browser opens the local chat UI.',
          '',
          'No installation and no internet connection are required.',
          'The default model, llama.cpp engine, and MSVC runtime are included.',
          '',
          'Keep the folder writable: logs and runtime files are written next to the app.',
          'To stop Codai, press any key in the launcher window.',
          'Emergency cleanup: run kill.bat.'
        ) -join "`r`n"
        Set-Content -Path "$dest\README-PORTABLE.txt" -Value $portableReadme -Encoding UTF8

        $modelReadme = @(
          'This offline portable package includes the default model:',
          '',
          '  Qwen_Qwen3.5-0.8B-Q4_K_M.gguf',
          '',
          'No download is needed. To use another model, put its .gguf file here and set',
          '"model_name" in config.json to that filename.'
        ) -join "`r`n"
        Set-Content -Path "$dest\models\README.txt" -Value $modelReadme -Encoding UTF8

        $zip = "CodaiPro-$versionNumber-Portable-Offline-Windows.zip"
        Compress-Archive -Path "portable-offline\CodaiPro\*" -DestinationPath $zip
        "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Get-Item $zip | Select-Object Name, Length

    - name: Upload offline portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodaiPro-Windows-Portable-Offline
        path: ${{ steps.offline.outputs.zip }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build desktop installer
      shell: pwsh
      working-directory: desktop
      env:
        ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
        # The model makes the payload large; level 1 avoids the 32-bit 7-Zip
        # allocator running out of memory on smaller runners.
        ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
      run: |
        # Version comes from the release tag so the installer matches the release.
        $version = "${{ env.VERSION }}".TrimStart('v')
        npm version $version --no-git-tag-version --allow-same-version
        npm ci --include=dev
        if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
        npx electron-builder --win --x64 --config electron-builder.yml
        if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }
        Get-ChildItem ../build/desktop -Filter *.exe | Format-Table Name, Length

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodaiPro-Windows-Installer
        path: build/desktop/CodaiPro_Setup_*.exe

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compute version number
      id: version
      shell: bash
      run: echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

    - name: Download portable artifact
      uses: actions/download-artifact@v4
      with:
        name: CodaiPro-Windows-Portable
        path: release-assets

    - name: Download offline portable artifact
      uses: actions/download-artifact@v4
      with:
        name: CodaiPro-Windows-Portable-Offline
        path: release-assets

    - name: Download installer artifact
      uses: actions/download-artifact@v4
      with:
        name: CodaiPro-Windows-Installer
        path: release-assets

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: Codai Pro ${{ env.VERSION }}
        body: |
          ## Codai Pro ${{ env.VERSION }}

          Codai Pro is now a **native Windows desktop app**. It opens in its own window with a ChatGPT-style chat, keeps your history, streams answers token by token, and the installer includes the default model — so there is no file to hunt down or download before you can start.

          ### New in this release
          - **One-click installer**: one extraction/progress screen, then Codai Pro installs per-user and launches automatically
          - **Bundled model**: the Windows installer includes the default model, so first launch is fully offline (no first-run download)
          - **Bundled runtime**: the MSVC runtime ships app-local, so users do not need the VC++ Redistributable
          - **Desktop app**: native window, tray icon, chat history, search, rename, and delete
          - **Chat interface**: streaming answers, markdown, syntax-highlighted code with copy buttons, Stop that keeps partial output, Regenerate, and light/dark themes
          - **Startup checks**: the app verifies its runtime, engine, VC++ runtime, model, disk, and memory before opening the chat window, and shows **Try again / Open logs folder / Quit** instead of a blank screen
          - **Model-ready gate**: the chat window opens only after llama-server can actually answer, so the first message cannot hit "Loading model"
          - **Low-memory fallback**: context size steps down automatically when available RAM is tight
          - **Crash recovery**: an unexpected engine exit offers **Restart** without closing the app
          - **Security**: every local API request now requires a per-session token, the `Host` header is validated against loopback to block DNS rebinding, and the wildcard CORS policy is gone
          - **Reliability**: the engine restarts after a crash instead of stalling, config errors are reported clearly, and the instance lock handles PID reuse
          - **Cleanup**: removed the legacy Inno Setup script, v3.0-era docs, the duplicate PRD case variant, and unused assets

          **Direct downloads:** [Windows installer](https://github.com/Luckyyaduvanshiofficial/Codaipro/releases/latest/download/CodaiPro_Setup_${{ steps.version.outputs.number }}.exe) · [Portable zip](https://github.com/Luckyyaduvanshiofficial/Codaipro/releases/latest/download/CodaiPro-${{ env.VERSION }}-Portable-Windows.zip) · [Offline portable zip](https://github.com/Luckyyaduvanshiofficial/Codaipro/releases/latest/download/CodaiPro-${{ steps.version.outputs.number }}-Portable-Offline-Windows.zip)

          ### Three downloads

          | File | What it is |
          |---|---|
          | `CodaiPro_Setup_*.exe` | **Installer (recommended).** One-click: extracts, installs, and launches. Start menu and desktop shortcuts, uninstaller, includes the default model, chats saved in `%APPDATA%`. |
          | `CodaiPro-*-Portable-Windows.zip` | **Portable.** Unzip to a writable folder or USB stick and run `run.bat`. Opens in your browser; downloads the model on first run. |
          | `CodaiPro-*-Portable-Offline-Windows.zip` | **Portable offline (USB).** Extract to a pendrive and run `run.bat`. Includes the default model, engine, and runtime; no install and no internet are needed. |

          ### First run
          1. Install and launch Codai Pro.
          2. Wait while the bundled model loads. The portable zip downloads the model once instead; the offline portable zip includes it.
          3. Chat. After this, everything runs offline.

          ### Notes
          - The installer is not code-signed yet, so Windows SmartScreen may warn. Choose **More info → Run anyway**.
          - If antivirus quarantines a file, the app names it before launch and offers **Try again**, **Open logs folder**, and **Quit**.
          - You can use any GGUF model: set `model_name` and `model_url` in `config.json`, or drop a file into `models\`.

          ### System requirements
          - Windows 10/11 (64-bit)
          - 4 GB RAM minimum (8 GB recommended)
          - ~1.5 GB installed including the default model; larger models need more

          **Full changelog**: [CHANGELOG.md](https://github.com/Luckyyaduvanshiofficial/Codaipro/blob/${{ env.VERSION }}/CHANGELOG.md) · [Install guide](https://github.com/Luckyyaduvanshiofficial/Codaipro/blob/${{ env.VERSION }}/INSTALLATION.md)
        draft: false
        prerelease: false
        files: |
          release-assets/CodaiPro-${{ env.VERSION }}-Portable-Windows.zip
          release-assets/CodaiPro-${{ steps.version.outputs.number }}-Portable-Offline-Windows.zip
          release-assets/CodaiPro_Setup_*.exe
